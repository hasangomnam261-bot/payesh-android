name: Build Payesh APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

```
  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check project ZIP
    run: |
      find . -maxdepth 2 -type f
      ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP not found"
        exit 1
      fi
      mkdir -p source
      unzip -q "$ZIP_FILE" -d source

  - name: Find Gradle project
    run: |
      find source -type f \( -name settings.gradle -o -name settings.gradle.kts \)
      find source -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

  - name: Build APK
    run: |
      PROJECT_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: No Gradle Android project found in ZIP"
        exit 1
      fi
      PROJECT_DIR="$(dirname "$PROJECT_FILE")"
      if [ -f "$PROJECT_DIR/gradlew" ]; then
        chmod +x "$PROJECT_DIR/gradlew"
        "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug
      else
        gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Payesh-v15.2-APK
      path: source/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
```
