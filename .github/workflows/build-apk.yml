name: Build Payesh APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: android-actions/setup-android@v3

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project ZIP
    run: |
      ZIP_FILE="$(find . -maxdepth 1 -name 'Payesh-v15.2-Export-Fix-Source.zip' -print -quit)"
      if [ -z "$ZIP_FILE" ]; then
        echo "Project ZIP not found"
        ls -la
        exit 1
      fi
      mkdir -p source
      unzip -q "$ZIP_FILE" -d source
      PROJECT_DIR="$(find source -name settings.gradle -print -quit | xargs dirname)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "Gradle project not found"
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build APK
    run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Payesh-v15.2-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
```
